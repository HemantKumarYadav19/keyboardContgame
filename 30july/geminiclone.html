<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini UI Clone with Functionality</title>
    <!-- Material Symbols for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --icon-color: #c4c7c5;
            --avatar-bg: #00796b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 64px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0;
            z-index: 10;
        }

        .sidebar-top, .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--icon-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            transition: background-color 0.2s;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .material-symbols-outlined {
            font-size: 22px;
            font-weight: 300;
        }

        /* Active icon styling */
        .active-icon {
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Avatar */
        .avatar {
            width: 28px;
            height: 28px;
            background-color: var(--avatar-bg);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at 50% 45%, rgba(26, 35, 75, 0.6) 0%, rgba(19, 19, 20, 1) 45%);
        }

        .top-right-actions {
            position: absolute;
            top: 24px;
            right: 24px;
        }

        .greeting {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 32px;
            letter-spacing: 0.2px;
        }

        /* Search Input Area */
        .search-container {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            border-radius: 32px;
            padding: 12px 16px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        .search-container:focus-within {
            background-color: #2a2b2e;
        }

        .search-container .material-symbols-outlined {
            font-size: 24px;
        }

        .add-btn {
            color: var(--text-secondary);
            margin-right: 12px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .add-btn:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .search-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-input::placeholder {
            color: #8e918f;
        }

        .pro-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 16px;
            transition: background-color 0.2s;
            user-select: none;
        }
        
        .pro-selector:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .pro-selector .material-symbols-outlined {
            font-size: 18px;
        }

        .mic-btn {
            color: var(--text-secondary);
            margin-left: 8px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .mic-btn:hover {
            background-color: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-top">
            <!-- Gemini Sparkle Logo -->
            <button class="icon-btn logo-btn" style="margin-bottom: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#9B72CB;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D96570;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z" fill="url(#grad1)"/>
                </svg>
            </button>
            <button class="icon-btn nav-item"><span class="material-symbols-outlined">history</span></button>
            <button class="icon-btn nav-item active-icon"><span class="material-symbols-outlined">edit_square</span></button>
            <button class="icon-btn nav-item"><span class="material-symbols-outlined">search</span></button>
            <button class="icon-btn nav-item"><span class="material-symbols-outlined">image</span></button>
            <button class="icon-btn nav-item"><span class="material-symbols-outlined">grid_view</span></button>
        </div>

        <div class="sidebar-bottom">
            <button class="icon-btn"><span class="material-symbols-outlined">settings</span></button>
            <div class="avatar" id="profileBtn">H</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Top Right Action -->
        <div class="top-right-actions">
            <button class="icon-btn" id="topEditBtn"><span class="material-symbols-outlined">edit</span></button>
        </div>

        <!-- Greeting -->
        <h1 class="greeting">Ask away, Hemant!</h1>

        <!-- Search Bar -->
        <div class="search-container">
            <span class="material-symbols-outlined add-btn" id="uploadBtn">add</span>
            <input type="text" class="search-input" id="promptInput" placeholder="Ask Gemini">
            
            <div class="pro-selector" id="modelSelector">
                Pro <span class="material-symbols-outlined">expand_more</span>
            </div>
            
            <div class="mic-btn" id="micBtn">
                <span class="material-symbols-outlined">mic</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Sidebar Navigation active state toggle
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    // Remove active class from all
                    navItems.forEach(nav => nav.classList.remove('active-icon'));
                    // Add active class to clicked item
                    item.classList.add('active-icon');
                });
            });

            // 2. Handling the Chat Input field
            const promptInput = document.getElementById('promptInput');
            promptInput.addEventListener('keypress', (event) => {
                // Check if the user pressed the 'Enter' key
                if (event.key === 'Enter') {
                    const promptText = promptInput.value.trim();
                    if (promptText !== '') {
                        alert(`Generating response for: "${promptText}"`);
                        promptInput.value = ''; // Clear the input field after sending
                    }
                }
            });

            // 3. Mock button clicks
            document.getElementById('uploadBtn').addEventListener('click', () => {
                alert('Upload file functionality would open here.');
            });

            document.getElementById('modelSelector').addEventListener('click', () => {
                alert('Model dropdown (Flash / Pro / Ultra) would appear here.');
            });

            document.getElementById('micBtn').addEventListener('click', () => {
                alert('Voice input activated. Listening...');
            });

            document.getElementById('topEditBtn').addEventListener('click', () => {
                alert('Opening advanced editor mode.');
            });

            document.getElementById('profileBtn').addEventListener('click', () => {
                alert('Opening Google Account settings.');
            });
        });
    </script>
</body>
</html>
