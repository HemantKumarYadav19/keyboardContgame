<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable About Page - White Region</title>
    <style>
        /* Base reset and dark background to frame the white region */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Dark background to match the outside of the white region in the image */
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* The White Region */
        .white-region {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 4px;
        }

        /* The inner bordered card */
        .content-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
        }

        p {
            font-size: 15px;
            color: #000000;
            margin-bottom: 25px;
            line-height: 1.5;
            padding: 5px; /* Padding added to prevent text jump when border is added during edit */
            border: 1px solid transparent; 
            border-radius: 4px;
        }

        /* Style applied when the text is being edited */
        p.editing {
            background-color: #f9f9f9;
            border: 1px dashed #999;
            outline: none;
        }

        .button-group button {
            background-color: #f5f5f5;
            border: 1px solid #cccccc;
            color: #333333;
            padding: 6px 16px;
            font-size: 13px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 5px;
        }

        .button-group button:hover {
            background-color: #e9e9e9;
        }

        .button-group button:active {
            background-color: #dddddd;
        }
    </style>
</head>
<body>

    <!-- ONLY THE WHITE REGION -->
    <div class="white-region">
        <div class="content-card">
            <h2>About Me</h2>
            
            <p id="about-text">I am learning DOM manipulation and building interactive web pages.</p>
            
            <div class="button-group">
                <button id="edit-btn" onclick="enableEdit()">Edit</button>
                <button id="save-btn" onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>

    <!-- JavaScript for DOM Manipulation -->
    <script>
        const aboutText = document.getElementById("about-text");

        // Function to make the text editable
        function enableEdit() {
            aboutText.contentEditable = "true";
            aboutText.classList.add("editing");
            aboutText.focus(); // Automatically place the cursor in the text
        }

        // Function to save and lock the text
        function saveEdit() {
            aboutText.contentEditable = "false";
            aboutText.classList.remove("editing");
        }
    </script>
</body>
</html>
