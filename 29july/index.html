<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Text Manipulator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:700px;
    background:#e4bff5;
    padding:30px;
    border-radius:12px;
    border:1px solid #ddd;
}

h1{
    font-size:40px;
    margin-bottom:25px;
}

textarea{
    width:100%;
    height:45px;
    padding:10px;
    font-size:18px;
    resize:none;
    border:1px solid #bbb;
}

#output{
    margin:20px 0;
    font-size:22px;

    transition: transform 0.3s ease-in-out;
     transform-origin: left center;
}
.scaled {
    transform: scale(1.5); /* Increases the size by 50% */
}

button{
    width:48%;
    padding:12px;
    font-size:18px;
    margin:8px 5px;
    cursor:pointer;
    background:#787676;
    border:1px solid #999;
}

.highlight{
    background:rgb(247, 247, 247);
}
</style>
</head>

<body>

<div class="container">

<h1>Interactive Text Manipulator</h1>

<textarea id="text" placeholder="Type something..."></textarea>

<p id="output">Your text will appear here.</p>

<button onclick="showText()">Show Text</button>
<button onclick="clearText()">Clear</button>
<br>
<button onclick="uppercase()">Uppercase</button>
<button onclick="toggleHighlight()">Toggle Highlight</button>

<button onclick="italic()">Italic font</button>
<button onclick="scaleText()">Scale Up</button>

</div>

<script>

function showText(){
    let text=document.getElementById("text").value;
    document.getElementById("output").innerHTML=text;
}

function clearText(){
    document.getElementById("text").value="";
    document.getElementById("output").innerHTML="Your text will appear here.";
}

function uppercase(){
    let text=document.getElementById("text").value;
    document.getElementById("output").innerHTML=text.toUpperCase();
}

function toggleHighlight(){
    document.getElementById("output").classList.toggle("highlight");
}

function italic(){
    let text = document.getElementById("text").value;
    document.getElementById("output").innerHTML="<i>"+ text+ "</i>";
}

function scaleText() {
    document.getElementById("output").classList.toggle("scaled");
}

</script>

</body>
</html>
